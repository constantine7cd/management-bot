name: management-bot
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: management
      POSTGRES_USER: management
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-management}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U management"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: .
    env_file: .env
    command: gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 2 --access-logfile -
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ["media-data:/app/media"]
    ports: ["8000:8000"]
  worker:
    build: .
    env_file: .env
    command: celery -A config worker -l INFO --concurrency=2
    depends_on: [db, redis]
    volumes: ["media-data:/app/media"]
  beat:
    build: .
    env_file: .env
    command: celery -A config beat -l INFO
    depends_on: [db, redis]
  bot:
    build: .
    env_file: .env
    command: python manage.py runbot
    profiles: ["local-bot"]
    depends_on: [db, redis]
    volumes: ["media-data:/app/media"]
volumes:
  postgres-data:
  redis-data:
  media-data:
